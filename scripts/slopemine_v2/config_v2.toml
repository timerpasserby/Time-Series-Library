# 这个配置文件统一管理 slopemine v2 的输入路径、空间分区、多尺度 patch、爆破映射和实验参数。
# 相关脚本：build_patch_dataset_v2.py、run_patch_baselines_v2.py

[paths]
raw_csv = "/Users/dc/Z研究生/eedsProject/device_10001_sorted.csv"
weather_csv = "/Users/dc/Z研究生/time_series/Time-Series-Library/dataset/slopemine/weather.csv"
blast_hourly_csv = "/Users/dc/Documents/hourly_blast_features_june_2024.csv"
blast_events_csv = "/Users/dc/Documents/simulated_blast_events_june_2024.csv"
dataset_dir = "dataset/slopemine_v2"
output_dir = "outputs/slopemine_v2"

[processing]
patch_sizes = [8, 10]
sparse_patch_min_points = 12
active_speed_threshold = 0.0001
chunksize = 1000000
background_zone_key = "stable_background"
official_background_policy = "single_patch_exclude_from_train"
polygon_boundary_tolerance = 1e-9
blast_decay_tau_hours = 12.0
blast_decay_6h_tau_hours = 3.0
blast_decay_24h_tau_hours = 12.0
default_sigma = 35.0
sigma_compare = [25.0, 35.0, 45.0]
lag_hours = 24
priority_order = ["stable_background", "platform", "crest", "toe", "middle_slope"]
representative_heatmap_count = 3
selected_time_heatmap_count = 3

[windows]
seq_lens = [24, 48, 96]
pred_lens = [1, 3, 6, 12]
train_ratio = 0.70
val_ratio = 0.15
dtype = "float32"

[baseline]
ridge_alpha = 5.0
recent_window = 6
best_metric = "mae"

[zone_catalog.stable_background]
zone_id = 1
label = "稳定背景区"
